                    - img [ref=e766]
                - generic [ref=e768]:
                  - generic [ref=e769]: "public List<Recipe> matchRecipes(List<Ingredient> fridgeItems) { List<Recipe> allRecipes = recipeDao.getAll(); List<Recipe> matched = new ArrayList<>(); for (Recipe r : allRecipes) { List<String> needed = recipeDao.getIngredients(r.id); int available = 0; List<String> missing = new ArrayList<>(); for (String ing : needed) { if (fridgeItems.stream().anyMatch(i -> i.name.equals(ing))) { available++; } else { missing.add(ing); } } double rate = (double) available / needed.size(); if (rate >= 0.8) { r.matchRate = rate; r.missingIngredients = missing; matched.add(r); } } Collections.sort(matched, (a, b) -> Double.compare(b.matchRate, a.matchRate)); return matched; }"
                  - button "Copy code to clipboard" [ref=e771] [cursor=pointer]:
                    - img [ref=e772]
