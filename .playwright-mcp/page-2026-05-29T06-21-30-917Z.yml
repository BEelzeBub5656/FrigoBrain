                  - generic [ref=e757]: "public class ExpireCheckService extends Service { @Override public int onStartCommand(Intent intent, int flags, int startId) { // 查询 48 小时内到期食材 // 构建通知 → NotificationManager.notify() // 设置 AlarmManager 明日再检查 return START_STICKY; } }"
