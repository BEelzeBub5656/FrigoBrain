                    - img [ref=e270]
                - generic [ref=e272]:
                  - heading "1.1 背景" [level=3] [ref=e273]
                  - 'link "Permalink: 1.1 背景" [ref=e274] [cursor=pointer]':
                    - /url: "#11-背景"
                    - img [ref=e275]
                - paragraph [ref=e277]: 现代家庭冰箱管理存在三个痛点：（1）食材买回来塞进冰箱后就忘了，过期浪费严重；（2）面对一冰箱食材不知道能做什么菜；（3）缺乏对家庭饮食营养的全局认知。本项目设计一款 Android APP，通过模拟视觉识别录入食材，结合营养学知识匹配菜谱并生成购物清单，帮助用户减少食物浪费、科学饮食。
                - generic [ref=e278]:
                  - heading "1.2 用户故事" [level=3] [ref=e279]
                  - 'link "Permalink: 1.2 用户故事" [ref=e280] [cursor=pointer]':
                    - /url: "#12-用户故事"
                    - img [ref=e281]
                - list [ref=e283]:
                  - listitem [ref=e284]: 用户打开冰箱 → 手机拍照 → APP 识别食材 → 自动入库
                  - listitem [ref=e285]: 食材即将过期 → 通知提醒 → 推荐含该食材的菜谱
                  - listitem [ref=e286]: 用户说"今晚做什么吃？"→ APP 根据现有食材推荐菜谱
                  - listitem [ref=e287]: 用户做了一道菜 → 记录摄入 → 营养报告自动更新
                  - listitem [ref=e288]: 缺食材 → 一键生成购物清单
